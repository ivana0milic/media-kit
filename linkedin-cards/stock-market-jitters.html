<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: 'Open Sans', sans-serif; background: #13234B; color: #fff; position: relative; }
  .chart { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content { position: absolute; left: 6.5vw; top: 0; bottom: 0; width: 60vw; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 1vw; font-size: 1.35vw; font-weight: 700; letter-spacing: 0.25vw; text-transform: uppercase; color: #6CC3E5; margin-bottom: 2.6vw; }
  .eyebrow .pill { background: #EC9446; color: #13234B; padding: 0.45vw 1.1vw; border-radius: 2vw; letter-spacing: 0.15vw; }
  h1 { font-size: 4.6vw; line-height: 1.12; font-weight: 800; letter-spacing: -0.05vw; }
  h1 em { font-style: normal; color: #6CC3E5; }
  .bar { width: 7vw; height: 0.5vw; background: #EC9446; border-radius: 1vw; margin-top: 3vw; }
  .footer { position: absolute; left: 6.5vw; right: 6.5vw; bottom: 4.2vw; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 2.1vw; font-weight: 700; letter-spacing: -0.03vw; }
  .brand span { color: #6CC3E5; }
  .url { font-size: 1.3vw; font-weight: 600; color: #B5B7C1; }
</style></head>
<body>
  <svg class="chart" viewBox="0 0 1200 627" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3E6389" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#13234B" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g stroke="#1E3760" stroke-width="1">
      <line x1="0" y1="140" x2="1200" y2="140"/><line x1="0" y1="260" x2="1200" y2="260"/>
      <line x1="0" y1="380" x2="1200" y2="380"/><line x1="0" y1="500" x2="1200" y2="500"/>
    </g>
    <path d="M820 300 L840 330 L865 300 L885 340 L905 270 L925 310 L945 240 L965 285 L985 205 L1005 345 L1025 270 L1045 310 L1065 230 L1085 360 L1105 290 L1125 320 L1145 250 L1165 385 L1185 320 L1200 350 L1200 627 L820 627 Z" fill="url(#fill)"/>
    <path d="M820 300 L840 330 L865 300 L885 340 L905 270 L925 310 L945 240 L965 285 L985 205 L1005 345 L1025 270 L1045 310 L1065 230 L1085 360 L1105 290 L1125 320 L1145 250 L1165 385 L1185 320 L1200 350" fill="none" stroke="#6CC3E5" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.9"/>
      </svg>
  <div class="content">
    <div class="eyebrow"><span class="pill">Newsletter</span>U.S. Economy</div>
    <h1>What could recent <em>stock market jitters</em> mean for the U.S. economy?</h1>
    <div class="bar"></div>
  </div>
  <div class="footer">
    <div class="brand">Focus<span>Economics</span></div>
    <div class="url">focus-economics.com</div>
  </div>
</body></html>
