<!--
  Google Tag Manager > Tags > New > Tag type: Custom HTML. Paste everything in this file.
  Trigger: new trigger, type "DOM Ready", fires on "Some DOM Ready Events": Page Path contains /demo-videos
  Makes the demo videos page work: tabs switch videos, links like /demo-videos/#track-a-commodity open
  that video, and a linked video starts playing (muted with a "Tap for sound" button if the browser requires it).
-->
<script>
(function () {
  var player = document.querySelector('.fe-player');
  if (!player) return;
  var panels = player.querySelectorAll('.fe-panel');
  var tabs = player.querySelectorAll('.fe-tabs a');
  function show(id, scroll) {
    var panel = document.getElementById(id);
    if (!panel || !panel.classList.contains('fe-panel')) panel = panels[0];
    panels.forEach(function (p) {
      p.style.display = p === panel ? 'block' : 'none';
      if (p !== panel) p.querySelector('video').pause();
    });
    tabs.forEach(function (t) {
      var on = t.getAttribute('href') === '#' + panel.id;
      t.style.background = on ? '#F8FCFD' : '';
      t.style.borderLeftColor = on ? '#EC9446' : 'transparent';
      if (on) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
    });
    if (scroll && player.getBoundingClientRect().top < 0) player.scrollIntoView({ behavior: 'smooth' });
    return panel;
  }
  // Browsers only let a video start on its own when muted, so fall back to muted with a "Tap for sound" button.
  function autoplay(video) {
    var attempt = video.play();
    if (!attempt) return;
    attempt.catch(function () {
      video.muted = true;
      video.play().then(function () { soundButton(video); }).catch(function () {});
    });
  }
  function soundButton(video) {
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = '🔇  Tap for sound';
    button.setAttribute('style', 'position: absolute; top: 14px; left: 14px; z-index: 2; background: #EC9446; color: #13234b; border: 0; border-radius: 20px; padding: 9px 16px; font: bold 15px -apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,Helvetica,Arial,sans-serif; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);');
    function done() {
      button.remove();
      video.removeEventListener('volumechange', onVolume);
    }
    function onVolume() { if (!video.muted) done(); }
    button.addEventListener('click', function () {
      video.muted = false;
      video.currentTime = 0;
      video.play();
      done();
    });
    video.addEventListener('volumechange', onVolume);
    video.parentNode.appendChild(button);
  }
  player.classList.add('fe-js');
  player.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    history.pushState(null, '', a.getAttribute('href'));
    show(a.getAttribute('href').slice(1), true);
  });
  window.addEventListener('popstate', function () { show(location.hash.slice(1), false); });
  var linked = show(location.hash.slice(1), false);
  // Arriving from a link to a specific video (e.g. from an email): start it playing.
  if (location.hash.slice(1) === linked.id) autoplay(linked.querySelector('video'));
})();
</script>
