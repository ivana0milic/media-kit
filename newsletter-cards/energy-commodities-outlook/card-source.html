<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1140px;height:666px;font-family:'Open Sans',sans-serif;overflow:hidden}
.card{display:flex;width:1140px;height:666px;border-radius:18px;overflow:hidden}
.left{width:684px;background:linear-gradient(135deg,#f9fafc 0%,#eceff5 100%);padding:58px 56px;position:relative}
.logo{height:30px;display:block}
.label{margin-top:92px;color:#C8702A;font-weight:700;font-size:21px;letter-spacing:2.6px}
h1{margin-top:20px;color:#13234B;font-weight:800;font-size:60px;line-height:1.08;letter-spacing:-1px}
h1 span{color:#3D6189}
.right{flex:1;background:radial-gradient(circle at 60% 45%,#17305a 0%,#0c1a36 70%);position:relative}
</style></head><body>
<div class="card">
 <div class="left">
  <img class="logo" src="logo.png">
  <div class="label">ENERGY COMMODITIES OUTLOOK</div>
  <h1>Where are <span>oil, gas and coal</span> prices heading?</h1>
 </div>
 <div class="right">
  <svg width="456" height="666" viewBox="0 0 456 666">
   <defs>
    <pattern id="g" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#2a4677" stroke-width="1" opacity=".45"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
   </defs>
   <rect width="456" height="666" fill="url(#g)"/>
   <g stroke="#6f8fbf" stroke-width="2.5" fill="none" opacity=".8">
    <path d="M26 54V26H54"/><path d="M402 26H430V54"/><path d="M26 612V640H54"/><path d="M402 640H430V612"/>
   </g>
   <g fill="#8fa9d1" opacity=".7"><path d="M120 120h12M126 114v12" stroke="#8fa9d1" stroke-width="2"/><path d="M360 470h12M366 464v12" stroke="#8fa9d1" stroke-width="2"/><path d="M90 520h12M96 514v12" stroke="#8fa9d1" stroke-width="2"/></g>
   <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M40 300 C90 250 120 330 165 280 S240 190 285 240 S350 210 380 190" stroke="#EC9445"/>
    <path d="M40 390 C85 360 125 420 170 380 S245 330 290 365 S350 330 380 320" stroke="#6CC3E5"/>
    <path d="M40 470 C90 455 130 495 175 470 S250 445 295 470 S350 450 380 445" stroke="#B5B7C1"/>
   </g>
   <g filter="url(#glow)"><circle cx="380" cy="190" r="9" fill="#EC9445"/><circle cx="380" cy="320" r="9" fill="#6CC3E5"/><circle cx="380" cy="445" r="9" fill="#B5B7C1"/></g>
   <g font-family="Open Sans" font-weight="700" font-size="22">
    <text x="372" y="166" fill="#EC9445" text-anchor="end">Oil</text>
    <text x="372" y="296" fill="#6CC3E5" text-anchor="end">Gas</text>
    <text x="372" y="421" fill="#d4d6de" text-anchor="end">Coal</text>
   </g>
  </svg>
 </div>
</div></body></html>
